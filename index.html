<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f2ff" />
  <title>Meme Soundboard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17132b;
      --muted: #6d6880;
      --line: rgba(37, 29, 72, 0.12);
      --shadow: 0 24px 70px rgba(75, 54, 131, 0.16), 0 4px 14px rgba(62, 45, 106, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, rgba(166, 220, 255, 0.68), transparent 29rem),
        radial-gradient(circle at 86% 18%, rgba(255, 194, 222, 0.66), transparent 28rem),
        radial-gradient(circle at 50% 95%, rgba(220, 203, 255, 0.7), transparent 34rem),
        #f9f8ff;
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 30rem;
      height: 30rem;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.42;
      pointer-events: none;
      animation: drift 13s ease-in-out infinite alternate;
    }

    body::before { left: -9rem; top: 25%; background: #8ee7f3; }
    body::after { right: -10rem; bottom: -6rem; background: #ffc0db; animation-delay: -5s; }

    main {
      width: min(1100px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(42px, 7vw, 84px) 0 48px;
      display: grid;
      align-content: center;
    }

    header { text-align: center; margin-bottom: clamp(28px, 5vw, 48px); }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      background: rgba(255,255,255,0.52);
      box-shadow: 0 8px 30px rgba(79, 56, 133, 0.08);
      color: #61587a;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7357ff;
      box-shadow: 0 0 0 5px rgba(115,87,255,.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 8vw, 6.3rem);
      line-height: 0.91;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(95deg, #6946ef, #c33fc1 52%, #ec6f87);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .lede {
      max-width: 590px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.16rem);
      line-height: 1.6;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .sound {
      --accent: #7757ff;
      --accent-soft: #ede8ff;
      appearance: none;
      position: relative;
      isolation: isolate;
      min-height: 280px;
      padding: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.9);
      border-bottom-color: rgba(51, 40, 91, 0.19);
      border-radius: 31px;
      color: var(--ink);
      background: linear-gradient(150deg, rgba(255,255,255,.92), rgba(255,255,255,.56));
      box-shadow: var(--shadow), inset 0 1px 0 #fff;
      cursor: pointer;
      text-align: left;
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      backdrop-filter: blur(22px);
      -webkit-tap-highlight-color: transparent;
    }

    .sound::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: auto -28% -40% 18%;
      height: 68%;
      border-radius: 50%;
      background: var(--accent-soft);
      filter: blur(28px);
      transition: transform .24s ease, opacity .24s ease;
    }

    .sound:hover {
      transform: translateY(-7px);
      border-color: color-mix(in srgb, var(--accent) 26%, white);
      box-shadow: 0 30px 75px rgba(65, 47, 112, 0.2), 0 7px 18px rgba(62, 45, 106, 0.1);
    }

    .sound:hover::after { transform: scale(1.18); opacity: .9; }

    .sound:active,
    .sound.is-playing {
      transform: translateY(4px) scale(.985);
      box-shadow: 0 8px 22px rgba(65, 47, 112, 0.16), inset 0 3px 8px rgba(34, 24, 73, 0.08);
    }

    .sound:focus-visible { outline: 4px solid color-mix(in srgb, var(--accent) 32%, transparent); outline-offset: 4px; }

    .sound:nth-child(2) { --accent: #388fca; --accent-soft: #d9f1ff; }
    .sound:nth-child(3) { --accent: #c34a83; --accent-soft: #ffe0ee; }
    .sound:nth-child(4) { --accent: #e26e34; --accent-soft: #ffe5d6; }

    .icon {
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      margin-bottom: 41px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 27px;
      background: var(--accent-soft);
      box-shadow: inset 0 1px 0 white, 0 12px 24px color-mix(in srgb, var(--accent) 14%, transparent);
      font-size: 3.2rem;
      transform: rotate(-3deg);
      transition: transform .2s cubic-bezier(.2,.85,.25,1.4);
    }

    .sound:hover .icon { transform: rotate(4deg) scale(1.07); }
    .sound.is-playing .icon { animation: pop .34s ease-out; }

    .label { display: block; font-size: 1.28rem; font-weight: 880; letter-spacing: -0.035em; }
    .caption { display: block; margin-top: 7px; color: var(--muted); font-size: .89rem; line-height: 1.4; }

    .key {
      position: absolute;
      top: 18px;
      right: 18px;
      min-width: 30px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.62);
      color: #777086;
      font-size: .72rem;
      font-weight: 800;
      text-align: center;
    }

    footer {
      margin-top: 28px;
      color: #7d768e;
      font-size: .82rem;
      text-align: center;
    }

    @keyframes drift { to { transform: translate3d(7vw, -4vh, 0) scale(1.08); } }
    @keyframes pop { 45% { transform: rotate(5deg) scale(1.16); } }

    @media (max-width: 860px) {
      main { align-content: start; }
      .board { grid-template-columns: repeat(2, 1fr); }
      .sound { min-height: 240px; }
      .icon { margin-bottom: 26px; }
    }

    @media (max-width: 500px) {
      main { width: min(100% - 24px, 1100px); padding-top: 32px; }
      .board { gap: 11px; }
      .sound { min-height: 210px; padding: 15px; border-radius: 24px; }
      .icon { width: 72px; height: 72px; margin-bottom: 24px; border-radius: 21px; font-size: 2.5rem; }
      .label { font-size: 1.05rem; }
      .caption { font-size: .78rem; }
      .key { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Press for instant drama</div>
      <h1>Four sounds. <span>Zero context.</span></h1>
      <p class="lede">Your personal chaos console. Tap a button—or use keys 1–4—and give the moment exactly the soundtrack it deserves.</p>
    </header>

    <section class="board" aria-label="Meme sound effects">
      <button class="sound" data-sound="money" aria-label="Play Money Sound FX">
        <span class="key" aria-hidden="true">1</span>
        <span class="icon" aria-hidden="true">💸</span>
        <span class="label">Money Sound</span>
        <span class="caption">For profits, payouts and suspiciously good timing.</span>
      </button>
      <button class="sound" data-sound="dictator" aria-label="Play Dictator Mbappé">
        <span class="key" aria-hidden="true">2</span>
        <span class="icon" aria-hidden="true">⚽</span>
        <span class="label">Dictator Mbappé</span>
        <span class="caption">Five seconds of football-flavoured authority.</span>
      </button>
      <button class="sound" data-sound="airhorn" aria-label="Play the MLG Airhorn">
        <span class="key" aria-hidden="true">3</span>
        <span class="icon" aria-hidden="true">📣</span>
        <span class="label">MLG Airhorn</span>
        <span class="caption">Maximum hype, straight from the montage era.</span>
      </button>
      <button class="sound" data-sound="homer" aria-label="Play Homer Lets the Barts Out">
        <span class="key" aria-hidden="true">4</span>
        <span class="icon" aria-hidden="true">🍩</span>
        <span class="label">Homer &amp; the Barts</span>
        <span class="caption">A wonderfully unhinged Springfield singalong.</span>
      </button>
    </section>

    <footer id="status" aria-live="polite">Sound on · Pick your moment</footer>
  </main>

  <script>
    const soundFiles = {
      money: 'media/money-soundfx.mp3',
      dictator: 'media/dictator-mbappe.mp3',
      airhorn: 'media/mlg-airhorn.mp3',
      homer: 'media/homer-lets-the-barts-out.mp3'
    };

    const sounds = Object.fromEntries(
      Object.entries(soundFiles).map(([name, file]) => {
        const audio = new Audio(file);
        audio.preload = 'auto';
        return [name, audio];
      })
    );

    const buttons = [...document.querySelectorAll('.sound')];
    const status = document.querySelector('#status');

    function stopSound() {
      Object.values(sounds).forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
      buttons.forEach(button => button.classList.remove('is-playing'));
    }

    async function play(button) {
      stopSound();
      const audio = sounds[button.dataset.sound];
      const label = button.querySelector('.label').textContent;
      button.classList.add('is-playing');
      status.textContent = `Now playing · ${label}`;

      audio.onended = () => {
        button.classList.remove('is-playing');
        status.textContent = 'Sound on · Pick your moment';
      };

      audio.onerror = () => {
        button.classList.remove('is-playing');
        status.textContent = `Couldn’t load ${label} · Check the media folder`;
      };

      try {
        await audio.play();
      } catch (error) {
        button.classList.remove('is-playing');
        status.textContent = `Couldn’t play ${label} · Tap to try again`;
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => play(button)));
    window.addEventListener('keydown', event => {
      const index = Number(event.key) - 1;
      if (index >= 0 && index < buttons.length && !event.repeat) play(buttons[index]);
    });
  </script>
</body>
</html>
